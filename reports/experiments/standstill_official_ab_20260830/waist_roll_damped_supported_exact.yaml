# Fixed StandStill A/B: retain baseline waist stiffness and pitch damping,
# increasing only waist-roll damping to approximately 2.0 Nms/rad. This
# isolates the common waist-roll velocity failure seen in both MuJoCo domains.
action_clip: 20.0

kp_scale_ankle_pitch: 2.25
kp_scale_ankle_roll: 2.25
kd_scale_ankle_pitch: 3.31
kd_scale_ankle_roll: 2.20

kd_scale_waist_pitch: 3.0
kd_scale_waist_roll: 2.20

max_target_dev_leg: 0.60
max_target_dev_waist: 0.20
max_target_dev_arm: 0.25
max_target_dev_head: 0.08

target_lpf_hz: 8.0
target_lpf_hz_waist: 2.5
