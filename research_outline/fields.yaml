      description: "相同初始化、数据、步数、学习率、reward 总和与随机种子。"
      detail_level: detailed
    actor_conflict_diagnostics:
      description: "分目标梯度 cosine、冲突率、范数比和投影改变量。"
      detail_level: detailed
    critic_interference_diagnostics:
      description: "各 head explained variance、TD/GAE 方差、校准误差和 head collapse。"
      detail_level: detailed
    reference_feasibility:
      description: "原 reference 可达性、修复幅度和失败归因。"
      detail_level: detailed
    metrics:
      description: "locomotion、upper、style、retention、value quality 和安全指标。"
      detail_level: detailed
    evaluation_domains:
      description: "ideal、nominal、nominal+delay、nominal+delay+noise。"
      detail_level: moderate
    statistics:
      description: "种子数量、置信区间、一致性和最坏情况报告。"
      detail_level: detailed
    compute_and_disk:
      description: "训练预算、GPU 显存、checkpoint 保留和磁盘上限。"
      detail_level: moderate
  decision:
    success_gate:
      description: "什么结果才允许进入中训/长训。"
      detail_level: detailed
    falsification:
      description: "什么结果说明假设失败或收益来自混淆因素。"
      detail_level: detailed
    stop_condition:
      description: "何时停止继续扫方法并形成负结果。"
      detail_level: detailed
    next_unlock:
      description: "只有哪些证据出现后才允许增加约束、梯度手术或 privileged critic。"
      detail_level: detailed
uncertain:
  - "CWI 是否会公开完整训练代码"
  - "当前 reward manager 生成多维 reward 所需的最小改动"
