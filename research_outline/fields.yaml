      description: "与 SONIC/X2 trainer、reward manager、LoRA 和 checkpoint 的兼容性。"
      detail_level: detailed
    reward_partition:
      description: "每个 reward term 唯一归属、尺度及分组理由。"
      detail_level: detailed
    critic_architecture:
      description: "single、shared-trunk multi-head 或独立 critic 的实现。"
      detail_level: detailed
    advantage_fusion:
      description: "分头 GAE、归一化和 actor advantage 聚合方式。"
      detail_level: detailed
    deployability:
      description: "actor 观测在部署时是否可得；privileged 信息只能进入 critic。"
      detail_level: detailed
