topic: "仿真中的跨具身全身策略多目标冲突：CWI-inspired decomposed critics for PEFT"
date: "2026-07-26"
primary_question: >-
  在把预训练 G1/SONIC 全身策略通过 LoRA/PEFT 迁移到 X2 时，将 locomotion、
  upper-body imitation 与 whole-body/style regularization 拆给不同 critic，
  是否能减少价值估计干扰并降低迁移中的能力遗忘？
items:
  - id: decomposed_critic_peft
    priority: 1
    role: main_line
    description: "单 actor + 分目标 value heads + 分头 GAE/归一化，用于跨具身 PEFT。"
  - id: dual_vs_triple_critic
    priority: 2
    role: causal_ablation
    description: "先比较 single/dual critic，再在有可靠第三目标时扩展 triple critic。"
  - id: semantic_vs_shuffled_grouping
    priority: 3
    role: negative_control
    description: "比较语义分组与错误分组，区分结构收益和语义收益。"
  - id: critic_value_diagnostics
    priority: 4
    role: mechanism
    description: "解释方差、TD residual、advantage 相关性与分组梯度冲突诊断。"
  - id: data_usage_decoupling
    priority: 5
    role: competing_explanation
    description: "上肢使用多样动作、下肢使用干净动力学动作，区分数据冲突与 critic 冲突。"
  - id: constrained_advantage_fusion
    priority: 6
    role: evidence_gated_extension
    description: "仅当稳定性仍被自由权衡时，引入 safety-first/lexicographic 聚合。"
  - id: gradient_conflict_surgery
    priority: 7
    role: evidence_gated_extension
    description: "仅在测得 actor 分组梯度持续负余弦后测试 GCR-PPO/PCGrad/CAGrad 类方法。"
  - id: phase_privileged_critic
    priority: 8
    role: evidence_gated_extension
    description: "critic 使用仿真 contact/COM/DCM/phase，actor 保持部署可用观测。"
  - id: reference_feasibility_projection
    priority: 9
    role: competing_explanation
    description: "若 ideal 域仍失败，测试 reference repair/projection，而不是继续扩 critic。"
  - id: preference_conditioning
    priority: 10
    role: future
    description: "动态调节 locomotion/upper/style 偏好；不进入第一轮最小实验。"
execution:
  batch_size: 1
  items_per_agent: 1
  output_dir: "/home/humanplus/projects/ZHY/CWI_CrossEmbodiment_Sim/results"
  simulation_only: true
  real_robot_actuation: false
  order: "严格串行；通过阶段门后才解锁下一方法"
sources:
  - "https://arxiv.org/abs/2606.27676"
  - "https://arxiv.org/abs/2606.11891"
  - "https://arxiv.org/abs/2509.14816"
  - "https://arxiv.org/abs/2507.09371"
  - "https://arxiv.org/abs/2408.00776"
  - "https://arxiv.org/abs/2603.24047"
