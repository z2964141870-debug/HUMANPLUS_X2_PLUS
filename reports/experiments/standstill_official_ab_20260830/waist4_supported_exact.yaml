# Fixed StandStill A/B: quadruple waist pitch/roll stiffness while preserving
# approximately the baseline damping ratio. This is the upper offline scan
# bound; it must not be copied to hardware without a separate review.
action_clip: 20.0

kp_scale_ankle_pitch: 2.25
kp_scale_ankle_roll: 2.25
kd_scale_ankle_pitch: 3.31
kd_scale_ankle_roll: 2.20

kp_scale_waist_pr: 4.0
kd_scale_waist_pitch: 6.0
kd_scale_waist_roll: 2.0

max_target_dev_leg: 0.60
max_target_dev_waist: 0.20
max_target_dev_arm: 0.25
max_target_dev_head: 0.08

target_lpf_hz: 8.0
target_lpf_hz_waist: 2.5
