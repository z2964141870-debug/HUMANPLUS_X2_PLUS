      description: "相对 CWI 和既有多 critic 工作的真正新增问题。"
      detail_level: detailed
    target_failure:
      description: "具体解决价值混叠、梯度冲突、能力遗忘还是 reference 不可执行。"
      detail_level: detailed
    claim_boundary:
      description: "能够支持和不能支持的论文表述。"
      detail_level: detailed
  implementation:
